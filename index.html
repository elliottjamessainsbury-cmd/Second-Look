<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Look</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=38" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <h1>
            <span>Second</span>
            <span class="hero-indent">Look</span>
          </h1>
          <p class="hero-text">
            Start from your taste, not a catalogue search. Filter the curated universe by platform, language, genre, and mood, then let your saves and dismissals shape what comes next.
          </p>
        </div>

        <aside class="hero-panel">
          <blockquote id="rotating-film-quote" class="rotating-film-quote" aria-live="polite"></blockquote>
        </aside>
      </header>

      <main class="home-flow">
        <section class="recommendations-section results card">
          <div class="results-head">
            <div>
              <h2 id="results-title">Browse curated films</h2>
            </div>
            <button id="clear-recommendations" class="text-button" type="button" hidden>
              Reset session
            </button>
          </div>

          <div class="browse-layout">
            <aside class="browse-filters card" id="taste-refine-section" aria-labelledby="browse-filters-title">
              <div class="browse-filters__head">
                <div>
                  <p class="eyebrow">Curated taste card</p>
                  <h3 id="browse-filters-title">Filter the universe</h3>
                </div>
                <button id="reset-filters" class="text-button" type="button">Reset filters</button>
              </div>
              <p id="browse-summary" class="browse-filters__summary"></p>
              <div class="browse-filters__grid" aria-label="Filter curated films">
                <label class="browse-filter">
                  <span class="browse-filter__label">Platform</span>
                  <select id="browse-platform-filter" class="browse-filter__select">
                    <option value="">All platforms</option>
                  </select>
                </label>
                <label class="browse-filter">
                  <span class="browse-filter__label">Language</span>
                  <select id="browse-language-filter" class="browse-filter__select">
                    <option value="">All languages</option>
                  </select>
                </label>
                <label class="browse-filter">
                  <span class="browse-filter__label">Genre</span>
                  <select id="browse-genre-filter" class="browse-filter__select">
                    <option value="">All genres</option>
                  </select>
                </label>
                <label class="browse-filter">
                  <span class="browse-filter__label">Mood</span>
                  <select id="browse-mood-filter" class="browse-filter__select">
                    <option value="">All moods</option>
                  </select>
                </label>
              </div>
              <div id="discovery-bookmarks" class="discovery-bookmarks" aria-live="polite"></div>
            </aside>

            <div class="browse-results">
              <div id="results-grid" class="results-grid browse-results__grid" aria-live="polite"></div>
            </div>
          </div>
          <div id="criterion-section" class="criterion-section"></div>
        </section>

        <section class="calendar-preview-section cinema-showtimes card" id="cinema-showtimes-section" aria-labelledby="cinema-showtimes-title">
          <div class="cinema-showtimes__head">
            <div>
              <h2 id="cinema-showtimes-title">Playing in London this week</h2>
              <p id="cinema-showtimes-intro" class="cinema-showtimes__intro"></p>
              <p id="cinema-showtimes-updated" class="cinema-showtimes__updated">Loading showtimes...</p>
            </div>
            <div class="cinema-showtimes__head-tools">
              <p id="cinema-showtimes-month" class="cinema-showtimes__month"></p>
              <button id="cinema-showtimes-today" class="cinema-showtimes__today" type="button">Today</button>
            </div>
          </div>

          <div class="cinema-showtimes__filters" aria-label="Filter cinema showtimes">
            <label class="cinema-showtimes__filter">
              <span class="cinema-showtimes__filter-label">Cinema</span>
              <select id="cinema-showtimes-cinema-filter" class="cinema-showtimes__filter-select">
                <option value="">All cinemas</option>
              </select>
            </label>
          </div>

          <div id="cinema-showtimes-calendar" class="cinema-showtimes__calendar" aria-label="Choose a showtimes date"></div>
          <div class="cinema-showtimes__list-head">
            <p id="cinema-showtimes-selection" class="cinema-showtimes__selection" aria-live="polite"></p>
          </div>
          <div id="cinema-showtimes-list" class="cinema-showtimes__list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="./lib/recommendation-engine.js"></script>
    <script src="./lib/editorial-copy.js"></script>
    <script src="./app.js?v=46"></script>
  </body>
</html>
