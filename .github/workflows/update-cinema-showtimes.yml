name: Update Cinema Showtimes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 0,4"

jobs:
  update-showtimes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dateutil

      - name: Build cinema showtimes
        run: python scripts/build_cinema_showtimes.py

      - name: Commit updated showtimes
        run: |
          if git diff --quiet -- data/cinema-showtimes.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cinema-showtimes.json
          git commit -m "Update cinema showtimes"
          git push
